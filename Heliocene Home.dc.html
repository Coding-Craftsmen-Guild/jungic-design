<script type="text/x-dc" data-dc-script data-props="{&quot;textImageLayout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;alternate&quot;,&quot;image-right&quot;,&quot;image-left&quot;],&quot;default&quot;:&quot;alternate&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { faq: 0, lb: null, gi: 0, sent: false };
  trackRef = React.createRef();

  componentDidMount() {
    this.onKey = (e) => {
      if (this.state.lb === null) return;
      if (e.key === 'Escape') this.setState({ lb: null });
      if (e.key === 'ArrowRight') this.step(1);
      if (e.key === 'ArrowLeft') this.step(-1);
    };
    window.addEventListener('keydown', this.onKey);
  }
  componentWillUnmount() { window.removeEventListener('keydown', this.onKey); }
  componentDidUpdate(p) { if (p.brand !== this.props.brand) this.setState({ faq: 0, lb: null, gi: 0, sent: false }); }

  step(d) {
    const n = this.content().gallery.items.length;
    this.setState(s => ({ lb: (s.lb + d + n) % n }));
  }
  scrollTrack(d) {
    const el = this.trackRef.current; if (!el) return;
    const card = el.children[0]; const w = card ? card.getBoundingClientRect().width + 20 : 600;
    el.scrollBy({ left: d * w, behavior: 'smooth' });
  }

  buttons(t) {
    const base = (bg, fg, border) => ({ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: '8px', height: '48px', padding: '0 26px', borderRadius: '6px', border: `2px solid ${border}`, background: bg, color: fg, fontFamily: t.body, fontSize: '15px', fontWeight: 600, letterSpacing: '0.2px', textDecoration: 'none', whiteSpace: 'nowrap', cursor: 'pointer', transition: 'all .25s ease' });
    const lift = { transform: 'translateY(-2px)', boxShadow: '0 12px 22px -10px rgba(0,0,0,.45)' };
    const solid = (bg, fg, hBg, hFg) => ({ style: base(bg, fg, bg), hover: { ...lift, background: hBg, borderColor: hBg, color: hFg || fg } });
    const outline = (c, hFg) => ({ style: base('transparent', c, c), hover: { ...lift, background: c, color: hFg } });
    return {
      primary: solid(t.primary, t.onPrimary, t.primaryHover),
      secondary: solid(t.secondary, t.onSecondary, t.secondaryHover),

        ],
        topics: ['Zakup poslovnog prostora', 'Zakup stana', 'Upravljanje nekretninom', 'Ostalo'],
        contact: { email: 'office@patriaproperties.rs', phone: '(+381) 34 000 000', addresses: ['Industrijska 7, 34000 Kragujevac'], map: 'Industrijska 7, Kragujevac' },
        footerText: 'Izdavanje i upravljanje nekretninama u Kragujevcu.', social: ['Instagram', 'Facebook', 'LinkedIn']
      }
    }[this.props.brand || 'jungic'] || null;
  }

  renderVals() {
    const brand = this.props.brand || 'jungic';
    const t = this.themes()[brand] || this.themes().jungic;
    const c = this.content();
    const layout = this.props.textImageLayout || 'alternate';
    const d1 = layout === 'image-left' ? 'row-reverse' : 'row';
    const d2 = layout === 'image-right' ? 'row' : layout === 'image-left' ? 'row-reverse' : 'row-reverse';
    const items = c.gallery.items;
    const n = items.length;
    const lb = this.state.lb;
    return {
      t, c, btn: this.buttons(t),
      showGuides: this.props.showGuides ?? true,
      ti1: { dir: d1 }, ti2: { dir: d2 },
      trackRef: this.trackRef,
      onTrackScroll: (e) => { const el = e.currentTarget; const w = el.children[0] ? el.children[0].getBoundingClientRect().width + 20 : 1; const gi = Math.round(el.scrollLeft / w); if (gi !== this.state.gi) this.setState({ gi }); },
      galleryCount: String(Math.min(this.state.gi + 1, n)).padStart(2, '0') + ' / ' + String(n).padStart(2, '0'),
      galPrev: () => this.scrollTrack(-1), galNext: () => this.scrollTrack(1),
      gallery: items.map((g, i) => ({ ...g, open: () => this.setState({ lb: i }) })),
      lbOpen: lb !== null, lb: lb !== null ? items[lb] : {},
      lbCount: lb !== null ? (lb + 1) + ' / ' + n : '',
      lbPrev: (e) => { e.stopPropagation(); this.step(-1); }, lbNext: (e) => { e.stopPropagation(); this.step(1); },
      lbClose: () => this.setState({ lb: null }), stop: (e) => e.stopPropagation(),
      faq: c.faq.map(([q, a], i) => { const open = this.state.faq === i; return { q, a, open, icon: open ? '−' : '+', iconBg: open ? t.primary : 'transparent', iconFg: open ? t.onPrimary : t.ink, iconBorder: open ? t.primary : t.line, toggle: () => this.setState({ faq: open ? -1 : i }) }; }),
      mapSrc: 'https://maps.google.com/maps?q=' + encodeURIComponent(c.contact.map) + '&z=15&output=embed',
      sent: this.state.sent, onSubmit: (e) => { e.preventDefault(); this.setState({ sent: true }); }
    };
  }
}
</script>
